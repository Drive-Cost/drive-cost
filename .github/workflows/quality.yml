name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - mobile
          - backend
    defaults:
      run:
        working-directory: code/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/${{ matrix.module }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  backend-postgres:
    name: Verify backend Postgres adapter
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: drivecost_test
          POSTGRES_USER: drivecost_test
          POSTGRES_PASSWORD: drivecost-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drivecost_test -d drivecost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgres://drivecost_test:drivecost-test-password@localhost:5432/drivecost_test
