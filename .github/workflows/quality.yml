name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - mobile
          - backend
    defaults:
      run:
        working-directory: code/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/${{ matrix.module }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
